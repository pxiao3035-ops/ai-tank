/* 独立部署时的联机通道：用 WebSocket 连同一个网址下的 /ws，对游戏提供和 Claude 页面里一样的“房间”接口 */
(function () {
  if (window.claude && window.claude.use) return;
  window.AITANK_SERVER = 1;
  var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws', ws = null, me = '', up = false, retry = 0, started = false, ready = [];
  var rooms = new Map();
  function send(o) { if (up) try { ws.send(JSON.stringify(o)); } catch (e) { } }
  function mk(name) {
    var R = { name: name, mine: {}, peers: new Map(), at: new Map(), subs: new Set(), snap: null, dirty: false, sendT: 0, left: false, okW: [] };
    R.notify = function () { R.snap = null; if (R.dirty) return; R.dirty = true; requestAnimationFrame(function () { R.dirty = false; R.subs.forEach(function (f) { f({ peers: api.peers(), joined: [], left: [], updated: [] }); }); }); };
    var flush = function () { R.sendT = 0; if (!R.left) send({ t: 'p', room: name, presence: R.mine }); };
    var api = {
      name: name,
      presence: function (patch) {
        if (R.left) return Promise.reject({ code: 'invalid_argument' });
        var next = Object.assign({}, R.mine); for (var k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
        if (new TextEncoder().encode(JSON.stringify(next)).length > 4096) return Promise.reject({ code: 'invalid_argument', message: 'over 4 KiB' });
        R.mine = next; R.notify(); if (!R.sendT) R.sendT = setTimeout(flush, 33); return Promise.resolve();
      },
      peers: function () { if (R.snap) return R.snap; var a = [Object.freeze({ peer: me, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: Object.freeze(JSON.parse(JSON.stringify(R.mine))), updatedAt: Date.now() })]; R.peers.forEach(function (q, p) { a.push(Object.freeze({ peer: p, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: q, updatedAt: R.at.get(p) || 0 })); }); return (R.snap = Object.freeze(a)); },
      onPeers: function (fn) { R.subs.add(fn); Promise.resolve().then(function () { fn({ peers: api.peers(), joined: api.peers(), left: [], updated: [] }); }); return function () { R.subs.delete(fn); }; },
      emit: function () { return Promise.resolve(); }, on: function () { return function () { }; }, connected: function () { return up; }, onConnection: function (fn) { Promise.resolve().then(function () { fn(up); }); return function () { }; },
      leave: function () { if (R.left || !name) return Promise.resolve(); R.left = true; rooms.delete(name); send({ t: 'leave', room: name }); return Promise.resolve(); },
      join: function (n) {
        if (!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(n)) return Promise.reject({ code: 'invalid_argument' });
        if (!up) return Promise.reject({ code: 'upstream_error' });
        var r = rooms.get(n); if (r) return Promise.resolve(r.api);
        r = mk(n); rooms.set(n, r); send({ t: 'join', room: n });
        return new Promise(function (res, rej) { var t = setTimeout(function () { rooms.delete(n); rej({ code: 'upstream_error' }); }, 10000); r.okW.push(function (ok) { clearTimeout(t); if (ok) res(r.api); else { rooms.delete(n); rej({ code: 'limit_reached' }); } }); });
      },
    };

  }
  var lobby = mk(''); rooms.set('', lobby);
  function connect() {
    try { ws = new WebSocket(url); } catch (e) { return; }
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.t === 'hi') {            // 连上（或断线重连）：重新进各个房间，把自己的状态再报一遍
        me = m.peer; up = true; retry = 0;
        rooms.forEach(function (R) { R.peers.clear(); if (R.name) send({ t: 'join', room: R.name }); if (Object.keys(R.mine).length) send({ t: 'p', room: R.name, presence: R.mine }); R.notify(); });
        ready.splice(0).forEach(function (f) { f(true); }); return;
      }
      var R = rooms.get(m.room); if (!R) return;

})();

/* 布局：菜单面板压在一场正在进行的 AI 对战上；开打后战场居中，HUD 在上，触屏按键在下 */

  useItem(t) {

  stepThings() {

  // ---------- 模式规则 ----------
  setupPve() {

  pveUpdate() {

  modeUpdate() {

  },
  ctfUpdate() {

  // AI 的模式目标点（像素坐标，坦克左上角）

  // ---------- Boss ----------

      });

    return best;
  },
  bossUpdate(t) {

    if (phase > B.phase) { B.phase = phase; this.boss.phase = phase; t.shield = 80; B.burstT = 50; this.ev.push({ k: 'phase', x: t.x + 24, y: t.y + 24, n: phase }); }
    B.shielded = false; for (const g of this.tanks) if (g.alive && g.kind === 'gen') { B.shielded = true; break; }

    }

    if (phase >= 2 && --B.burstT <= 0) { B.burstT = phase === 3 ? 170 : 240; const n = phase === 3 ? 12 : 8, off = this.rng.next() * 6.28; for (let i = 0; i < n; i++) { const a = off + i * 6.283 / n; fireAt(t.x + 24 + dcos(a) * 26, t.y + 24 + dsin(a) * 26, a, bs * 0.8); } this.ev.push({ k: 'blast', x: t.x + 24, y: t.y + 24, r: 20 }); }

    }
  },
  bossHit(t, b, src) {

  try { document.documentElement.style.setProperty('--cursor', 'url(' + Game.R.tankURL('medium', SKINS.gold.c, 1) + ')'); } catch (e) { }
  Game.S.music('menu'); Game.startDemo(); UI.show(/^#r\d{6}$/.test(location.hash) ? 'online' : 'main');      // 带房间号的邀请链接：直接进联机
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const l = document.getElementById('logo'); if (l) drawLogo(l); });
  addEventListener('hashchange', () => { if (/^#r\d{6}$/.test(location.hash) && !Net.ctl && UI.app.dataset.mode === 'menu' && UI.cur === 'main') UI.show('online'); });
  requestAnimationFrame(t => Game.frame(t));
}
(function () { const hot = window.claude && window.claude.hot; if (hot && hot.ready) hot.ready(boot); else boot(); })();
